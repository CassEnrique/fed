name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Clean previous build folders
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - name: Install dependencies
        run: |
          pip install setuptools==69.5.1
          pip install pyinstaller==5.13.2
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --clean interface.spec

      - name: Verify output
        shell: powershell
        run: |
          if (!(Test-Path "dist/FED/FED.exe")) {
            Write-Error "No se encontró dist/FED/FED.exe"
            exit 1
          }
          Get-ChildItem -Recurse dist/FED | Select-Object FullName

      - name: Upload FED folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: FED-windows
          path: dist/FED
