name: Build Windows EXE with Nuitka

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "icons/**"
      - "requirements.txt"
      - ".github/workflows/build-nuitka.yml"
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      # 1️⃣ Checkout
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Python 3.10
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      # 3️⃣ Verificar Python
      - name: ✅ Verify Python installation
        run: |
          python --version
          python -c "import sys; print(f'Platform: {sys.platform}')"

      # 4️⃣ Setup C++ compiler
      - name: 🛠️ Setup C++ compiler
        uses: ilammy/msvc-dev-cmd@v1

      # 5️⃣ Upgrade pip
      - name: 📦 Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 6️⃣ Instalar dependencias
      - name: 📚 Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      # 7️⃣ Compilar recursos Qt
      - name: 🎨 Compile Qt resources
        run: |
          pyrcc5 icons/sources.qrc -o src/resources_rc.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Resources compiled successfully"

      # 8️⃣ Verificar imports críticos
      - name: 🔍 Verify critical imports
        run: |
          Write-Host "Testing imports..."
          python -c "import PyQt5; print('OK: PyQt5')"
          python -c "import torch; print('OK: Torch')"
          python -c "import cv2; print('OK: OpenCV')"
          python -c "import easyocr; print('OK: EasyOCR')"
          python -c "import openpyxl; print('OK: OpenPyXL')"
          Write-Host "All critical imports OK"

      # 9️⃣ Limpiar builds anteriores
      - name: 🧹 Clean previous builds
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path nuitka_output) { Remove-Item -Recurse -Force nuitka_output }

      # 🔟 Compilar con Nuitka
      - name: 🔨 Build with Nuitka
        run: |
          Write-Host "Starting Nuitka compilation..."
          nuitka `
            --onefile `
            --windows-icon=icons/favicon.ico `
            --output-dir=dist `
            --remove-output `
            --include-package=torch `
            --include-package=torchvision `
            --include-package=easyocr `
            --include-package=cv2 `
            --include-package=numpy `
            --include-package=pandas `
            --include-package=openpyxl `
            --include-package=rapidfuzz `
            --include-package=pymupdf `
            --include-data-dir=icons=icons `
            --follow-imports `
            --no-prefer-source-code `
            --jobs=4 `
            src/interface.py

          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Compilation successful"

      # 1️⃣1️⃣ Verificar que se creó el .exe
      - name: ✓ Verify executable
        run: |
          if (!(Test-Path "dist/interface.exe")) {
            Write-Error "interface.exe not found!"
            Get-ChildItem -Recurse dist
            exit 1
          }
          $fileSize = (Get-Item "dist/interface.exe").Length / 1MB
          Write-Host "Executable created successfully"
          Write-Host "File size: $([math]::Round($fileSize, 2)) MB"
          Get-ChildItem dist/interface.exe

      # 1️⃣2️⃣ Crear ZIP para distribución
      - name: 📦 Create release package
        run: |
          mkdir release_package
          Copy-Item dist/interface.exe release_package/
          Compress-Archive -Path release_package -DestinationPath FED-windows-nuitka.zip

          $zipSize = (Get-Item FED-windows-nuitka.zip).Length / 1MB
          Write-Host "ZIP created: FED-windows-nuitka.zip"
          Write-Host "ZIP size: $([math]::Round($zipSize, 2)) MB"

      # 1️⃣3️⃣ Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FED-windows-nuitka
          path: dist/interface.exe
          retention-days: 30

      # 1️⃣4️⃣ Upload ZIP artifact
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FED-windows-nuitka-zip
          path: FED-windows-nuitka.zip
          retention-days: 30

      # 1️⃣5️⃣ Crear Release automática (si es tag)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/interface.exe
            FED-windows-nuitka.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 1️⃣6️⃣ Success notification
      - name: Success notification
        if: success()
        run: |
          Write-Host "Build completed successfully!"
          Write-Host "Artifact: FED-windows-nuitka"
          Write-Host "Download from Actions tab"

      # 1️⃣7️⃣ Error notification
      - name: Error notification
        if: failure()
        run: |
          Write-Host "Build failed!"
          Write-Host "Check logs above for details"
          exit 1
