name: Build Windows EXE with Nuitka (Fixed)

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: 🔎 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 💻 Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: 🚀 Upgrade pip & core tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          Write-Host "✅ pip, setuptools, wheel upgraded"

      - name: 📦 Install dependencies from requirements.txt
        run: |
          Write-Host "📥 Installing main dependencies from requirements.txt..."
          pip install -r requirements.txt -v

          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Failed to install requirements"
            exit 1
          }

          Write-Host "✅ All dependencies installed"

      - name: 🛠️ Install build tools
        run: |
          Write-Host "📥 Installing build tools (PyQt5-tools, Nuitka, zstandard)..."
          pip install PyQt5-tools nuitka zstandard

          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Failed to install build tools"
            exit 1
          }

          Write-Host "✅ Build tools installed"
          Write-Host ""
          Write-Host "📍 pyrcc5 version:"
          pyrcc5 --version
          Write-Host ""
          Write-Host "📍 nuitka version:"
          nuitka --version

      - name: 🎨 Compile Qt resources
        run: |
          Write-Host "🔨 Compiling Qt resources from icons/sources.qrc..."
          pyrcc5 icons/sources.qrc -o src/resources_rc.py

          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Failed to compile Qt resources"
            exit 1
          }

          Write-Host "✅ Resources compiled successfully"
          Get-Item src/resources_rc.py | Format-Table FullName, Length

      - name: ✅ Verify critical imports
        run: |
          Write-Host "🔍 Verifying all critical imports..."
          Write-Host ""

          $modules = @(
              @("PyQt5", "GUI Framework"),
              @("torch", "PyTorch (CPU)"),
              @("cv2", "OpenCV"),
              @("fitz", "PyMuPDF"),
              @("easyocr", "EasyOCR"),
              @("pandas", "Pandas"),
              @("openpyxl", "OpenPyXL"),
              @("rapidfuzz", "RapidFuzz")
          )

          $failed = @()

          foreach ($item in $modules) {
              $module = $item[0]
              $name = $item[1]

              Write-Host -NoNewline "  Testing $name... "

              $output = python -c "import $module; print('OK')" 2>&1

              if ($LASTEXITCODE -eq 0) {
                  Write-Host "✓" -ForegroundColor Green
              } else {
                  Write-Host "✗ FAILED" -ForegroundColor Red
                  $failed += $module
              }
          }

          Write-Host ""

          if ($failed.Count -gt 0) {
              Write-Host "❌ Failed to import: $($failed -join ', ')" -ForegroundColor Red
              Write-Host ""
              Write-Host "Debug info:"
              python -m pip list | Select-String -Pattern "torch|cv2|pandas|openpyxl|PyQt5|easyocr|fitz"
              exit 1
          } else {
              Write-Host "✅ All critical imports verified!" -ForegroundColor Green
          }

      - name: 🧹 Clean previous builds
        run: |
          Write-Host "🧹 Cleaning previous outputs..."
          Remove-Item -Force -Recurse "build", "dist", "nuitka_output", ".nuitka", "__pycache__" -ErrorAction SilentlyContinue
          Write-Host "✅ Previous builds cleaned"

      - name: 🔧 Build with Nuitka
        run: |
          Write-Host "🚀 Starting Nuitka compilation (this may take 10-15 minutes)..."
          Write-Host ""

          nuitka `
            --onefile `
            --windows-icon=icons/favicon.ico `
            --output-dir=dist `
            --remove-output `
            --jobs=2 `
            --lto=yes `
            --disable-ccache `
            --include-module=fitz `
            --include-module=cv2 `
            --include-module=easyocr `
            --include-module=pandas `
            --include-module=openpyxl `
            --include-module=rapidfuzz `
            --include-package=torch `
            --include-package=torchvision `
            --exclude-module=torch.cuda `
            --exclude-module=nvidia.* `
            --exclude-module=tensorboard `
            --exclude-module=thinc `
            --exclude-module=*test* `
            --prefer-source-code=no `
            --include-data-dir=icons=icons `
            --follow-imports `
            --no-pyi-files `
            --windows-uac-admin `
            src/interface.py

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "❌ Nuitka compilation failed!" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "✅ Compilation completed successfully"

      - name: 📊 Verify executable
        run: |
          Write-Host "📊 Verifying executable..."
          $exe = "dist/interface.exe"

          if (Test-Path $exe) {
            $size = (Get-Item $exe).Length / 1MB
            Write-Host "✅ Executable created successfully!"
            Write-Host "📍 Path: $exe"
            Write-Host "📦 Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "❌ interface.exe not found!" -ForegroundColor Red
            Write-Host ""
            Write-Host "📁 Contents of dist folder:"
            if (Test-Path dist) {
              Get-ChildItem -Recurse dist
            } else {
              Write-Host "dist folder does not exist!"
            }
            exit 1
          }

      - name: 📦 Create release package
        run: |
          Write-Host "📦 Creating ZIP package..."
          mkdir -Force release
          Copy-Item dist/interface.exe release/FED-Application.exe
          Compress-Archive -Path release -DestinationPath FED-Windows.zip

          $zipSize = (Get-Item FED-Windows.zip).Length / 1MB
          Write-Host "✅ ZIP created: FED-Windows.zip ($([math]::Round($zipSize, 2)) MB)"

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FED-Windows-EXE
          path: |
            dist/interface.exe
            FED-Windows.zip
          retention-days: 30
          if-no-files-found: error

      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: "FED v${{ github.ref_name }}"
          body: |
            **FED Application - Windows Release**

            **Downloads:**
            - `FED-Application.exe` - Standalone executable
            - `FED-Windows.zip` - Portable package

            **Requirements:**
            - Windows 10 / Windows 11 (64-bit)
            - No Python installation required
            - ~600 MB disk space

            **Features:**
            - GUI for document automation
            - Excel processing (DIOT, IVA, V0, V16)
            - PDF text recognition and highlighting
            - Fuzzy matching for references
          files: |
            dist/interface.exe
            FED-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
