name: Build Windows EXE with Nuitka

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    environment: fed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Upgrade pip and core tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies from requirements.txt
        run: |
          Write-Host "Installing dependencies from requirements.txt..."
          pip install -r requirements.txt -v

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Failed to install requirements"
            exit 1
          }

      - name: Install build tools
        run: |
          Write-Host "Installing build tools..."
          pip install nuitka zstandard PyQt5-tools awscli

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Failed to install build tools"
            exit 1
          }

          Write-Host "Nuitka version:"
          python -m nuitka --version

      - name: Compile Qt resources
        run: |
          Write-Host "Compiling Qt resources..."
          pyrcc5 icons/sources.qrc -o src/resources_rc.py

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Failed to compile Qt resources"
            exit 1
          }

          Write-Host "Resources compiled successfully"

      - name: Verify critical imports
        run: |
          Write-Host "Verifying critical imports..."

          python -c "import PyQt5; print('PyQt5 OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          python -c "import torch; print('torch OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          python -c "import cv2; print('cv2 OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          python -c "import fitz; print('fitz OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          python -c "import easyocr; print('easyocr OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          python -c "import pandas; print('pandas OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          python -c "import openpyxl; print('openpyxl OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          python -c "import rapidfuzz; print('rapidfuzz OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "All critical imports verified"

      - name: Clean previous builds
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path nuitka_output) { Remove-Item -Recurse -Force nuitka_output }
          if (Test-Path ".nuitka") { Remove-Item -Recurse -Force ".nuitka" }
          if (Test-Path release_package) { Remove-Item -Recurse -Force release_package }

      - name: Build with Nuitka
        run: |
          Write-Host "Starting Nuitka build..."

          python -m nuitka `
            --onefile `
            --output-dir=dist `
            --remove-output `
            --windows-icon-from-ico=icons/favicon.ico `
            --assume-yes-for-downloads `
            --enable-plugin=pyqt5 `
            --include-package=torch `
            --include-package=torchvision `
            --include-package=easyocr `
            --include-module=cv2 `
            --include-module=fitz `
            --include-package=pandas `
            --include-package=openpyxl `
            --include-package=rapidfuzz `
            --include-data-dir=icons=icons `
            --nofollow-import-to=IPython `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=pytest `
            src/interface.py

          Write-Host "Nuitka exit code: $LASTEXITCODE"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Nuitka build failed"
            exit 1
          }

          Write-Host "Generated files in dist:"
          if (Test-Path dist) {
            Get-ChildItem -Recurse dist | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "dist folder not created"
            exit 1
          }

      - name: Verify executable
        run: |
          Write-Host "Verifying executable..."

          if (-not (Test-Path dist)) {
            Write-Host "dist folder does not exist"
            exit 1
          }

          Write-Host "Contents of dist:"
          Get-ChildItem -Recurse dist | ForEach-Object { Write-Host $_.FullName }

          $possiblePaths = @(
            "dist/interface.exe",
            "dist/interface/interface.exe",
            "dist/interface.dist/interface.exe",
            "interface.exe"
          )

          $found = $false
          $finalExe = ""

          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $size = (Get-Item $path).Length / 1MB
              Write-Host "Found executable at: $path"
              Write-Host "File size: $([math]::Round($size, 2)) MB"
              $found = $true
              $finalExe = $path
              break
            }
          }

          if (-not $found) {
            Write-Host "No executable found in expected locations"
            exit 1
          }

          "FINAL_EXE=$finalExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create release package
        run: |
          Write-Host "Creating ZIP package..."

          New-Item -ItemType Directory -Force -Path release_package | Out-Null

          Copy-Item $env:FINAL_EXE release_package/FED.exe
          Compress-Archive -Path release_package/* -DestinationPath FED-windows-nuitka.zip -Force

          if (-not (Test-Path FED-windows-nuitka.zip)) {
            Write-Host "Failed to create ZIP package"
            exit 1
          }

          $zipSize = (Get-Item FED-windows-nuitka.zip).Length / 1MB
          Write-Host "ZIP created successfully"
          Write-Host "ZIP size: $([math]::Round($zipSize, 2)) MB"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FED-exe
          path: ${{ env.FINAL_EXE }}
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FED-windows-nuitka-zip
          path: FED-windows-nuitka.zip
          retention-days: 30

      - name: Upload artifacts to Cloudflare R2
        # if: success() && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' && secrets.R2_ENDPOINT != ''
        if: ${{ success() && secrets.R2_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          Write-Host "Uploading artifacts to Cloudflare R2..."

          $exeKey = "FED/latest/interface.exe"
          $zipKey = "FED/latest/FED-windows-nuitka.zip"

          aws s3 rm "s3://$env:R2_BUCKET/$exeKey" --endpoint-url $env:R2_ENDPOINT
          aws s3 rm "s3://$env:R2_BUCKET/$zipKey" --endpoint-url $env:R2_ENDPOINT

          aws s3 cp "$env:FINAL_EXE" "s3://$env:R2_BUCKET/$exeKey" --endpoint-url $env:R2_ENDPOINT
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Failed to upload executable to R2"
            exit 1
          }

          aws s3 cp "FED-windows-nuitka.zip" "s3://$env:R2_BUCKET/$zipKey" --endpoint-url $env:R2_ENDPOINT
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Failed to upload ZIP to R2"
            exit 1
          }

          Write-Host "Artifacts uploaded to Cloudflare R2 successfully"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FINAL_EXE }}
            FED-windows-nuitka.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
