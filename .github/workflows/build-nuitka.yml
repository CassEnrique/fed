name: Build Windows EXE with Nuitka (Optimized)

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180 # Reducido, será más rápido

    steps:
      - name: 🔎 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 💻 Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: 🚀 Upgrade pip & tools
        run: |
          python -m pip install --upgrade pip setuptools wheel zstandard

      - name: 📦 Install dependencies (minimal build)
        run: |
          pip install -r requirements.txt
          pip install nuitka PyQt5-tools

          # Instalar solo Nuitka (no se necesita más)
          pip install nuitka

      - name: 🛠️ Compile Qt resources
        run: |
          pyrcc5 icons/sources.qrc -o src/resources_rc.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to compile Qt resources"
            exit 1
          }
          Write-Host "✅ Resources compiled: src/resources_rc.py"

      - name: ✅ Verify critical imports (before build)
        run: |
          python -c "import PyQt5; print('PyQt5: OK')"
          python -c "import torch; print('Torch: OK, version', torch.__version__)"
          python -c "import cv2; print('OpenCV: OK')"
          python -c "import fitz; print('PyMuPDF: OK')"
          python -c "import easyocr; print('EasyOCR: OK')"
          python -c "import pandas, openpyxl; print('Pandas/OpenPyXL: OK')"

      - name: 🧹 Clean previous builds
        run: |
          Remove-Item -Force -Recurse "build", "dist", "nuitka_output", ".nuitka", "__pycache__" -ErrorAction SilentlyContinue
          Write-Host "✅ Cleaned previous outputs"

      - name: 🔧 Build with Nuitka (Optimized Settings)
        run: |
          Write-Host "🚀 Starting Nuitka compilation..."
          Write-Host "Nuitka version: $(nuitka --version)"

          nuitka `
            --onefile `
            --windows-icon=icons/favicon.ico `
            --output-dir=dist `
            --remove-output `
            --jobs=2 `
            --lto=yes `
            --disable-ccache `

            # ===== Solo lo necesario =====
            --include-module=fitz `
            --include-module=cv2 `
            --include-module=easyocr `
            --include-module=pandas `
            --include-module=openpyxl `
            --include-module=rapidfuzz `

            # ===== PyTorch (CPU ONLY) =====
            --include-package=torch `
            --include-package=torchvision `
            --exclude-module=torch.cuda `
            --exclude-module=nvidia.* `
            --exclude-module=tensorboard `
            --exclude-module=thinc `
            --exclude-module=*test* `
            --exclude-module=tools `
            --prefer-source-code=no `

            # ===== Datos y recursos =====
            --include-data-dir=icons=icons `
            --include-data-file=src/resources_rc.py=resources_rc.py `

            # ===== Comportamiento =====
            --follow-imports `
            --no-pyi-files `
            --windows-uac-admin `

            # ===== Entrypoint =====
            src/interface.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Nuitka failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "✅ Compilation successful"

      - name: 📊 Verify executable
        run: |
          $exe = "dist/interface.exe"
          if (Test-Path $exe) {
            $size = (Get-Item $exe).Length / 1MB
            Write-Host "📦 Executable created: $exe"
            Write-Host "📊 Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "❌ interface.exe not found in dist/"
            Get-ChildItem -Recurse -Path dist -ErrorAction SilentlyContinue
            exit 1
          }

      - name: 📦 Create release package
        run: |
          mkdir -Force release
          Copy-Item dist/interface.exe release/FED-Application.exe
          Compress-Archive -Path release -DestinationPath FED-Windows.zip
          $zipSize = (Get-Item FED-Windows.zip).Length / 1MB
          Write-Host "✅ ZIP created: FED-Windows.zip ($([math]::Round($zipSize, 2)) MB)"

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FED-Windows-EXE
          path: |
            dist/interface.exe
            FED-Windows.zip
          retention-days: 30

      # ---- Solo en tags o releases ----
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: "FED v${{ github.ref_name }}"
          body: "Automated release of FED Application (Windows)"
          files: |
            dist/interface.exe
            FED-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
