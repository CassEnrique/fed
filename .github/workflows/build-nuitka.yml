name: Build Windows EXE with Nuitka

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Setup C++ compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Compile Qt resources
        run: |
          pyrcc5 icons/sources.qrc -o src/resources_rc.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Resources compiled successfully"

      - name: Verify critical imports
        run: |
          Write-Host "Testing imports..."
          python -c "import PyQt5; print('OK: PyQt5')"
          python -c "import torch; print('OK: Torch')"
          python -c "import cv2; print('OK: OpenCV')"
          python -c "import easyocr; print('OK: EasyOCR')"
          python -c "import openpyxl; print('OK: OpenPyXL')"
          Write-Host "All critical imports OK"

      - name: Clean previous builds
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path nuitka_output) { Remove-Item -Recurse -Force nuitka_output }
          if (Test-Path ".nuitka") { Remove-Item -Recurse -Force ".nuitka" }

      - name: Build with Nuitka (VERBOSE)
        run: |
          Write-Host "Starting Nuitka compilation..."
          Write-Host "Python version:" (python --version)
          Write-Host "Nuitka version:" (nuitka --version)
          Write-Host ""
          Write-Host "Command:"
          Write-Host "nuitka --onefile --windows-icon=icons/favicon.ico --output-dir=dist --remove-output --include-package=torch --include-package=torchvision --include-package=easyocr --include-package=cv2 --include-package=numpy --include-package=pandas --include-package=openpyxl --include-package=rapidfuzz --include-package=pymupdf --include-data-dir=icons=icons --follow-imports --no-prefer-source-code --jobs=2 src/interface.py"
          Write-Host ""

          # Ejecutar Nuitka con salida detallada
          nuitka `
            --onefile `
            --windows-icon=icons/favicon.ico `
            --output-dir=dist `
            --remove-output `
            --include-package=torch `
            --include-package=torchvision `
            --include-package=easyocr `
            --include-package=cv2 `
            --include-package=numpy `
            --include-package=pandas `
            --include-package=openpyxl `
            --include-package=rapidfuzz `
            --include-package=pymupdf `
            --include-data-dir=icons=icons `
            --follow-imports `
            --no-prefer-source-code `
            --jobs=2 `
            src/interface.py

          Write-Host "Nuitka exit code: $LASTEXITCODE"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Nuitka compilation failed!"
            exit 1
          }

          Write-Host "Compilation completed"

      - name: Debug - List dist folder
        if: always()
        run: |
          Write-Host "Contents of dist folder:"
          if (Test-Path dist) {
            Get-ChildItem -Recurse dist | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "dist folder does not exist!"
          }

      - name: Debug - List current directory
        if: always()
        run: |
          Write-Host "Current directory:"
          Get-Location
          Write-Host ""
          Write-Host "Files in current directory:"
          Get-ChildItem -Force

      - name: Verify executable
        run: |
          Write-Host "Checking for interface.exe..."
          $exePath = "dist/interface.exe"

          if (Test-Path $exePath) {
            $fileSize = (Get-Item $exePath).Length / 1MB
            Write-Host "SUCCESS: interface.exe found!"
            Write-Host "File size: $([math]::Round($fileSize, 2)) MB"
            Get-Item $exePath | Format-Table FullName, Length
          } else {
            Write-Host "FAILED: interface.exe not found at $exePath"
            Write-Host ""
            Write-Host "Checking alternative paths..."

            $altPaths = @(
              "dist/interface/interface.exe",
              "interface.exe",
              "dist/interface.dist/interface.exe"
            )

            foreach ($path in $altPaths) {
              if (Test-Path $path) {
                Write-Host "Found at: $path"
              }
            }

            exit 1
          }

      - name: Create release package
        run: |
          Write-Host "Creating ZIP package..."
          mkdir -Force release_package
          Copy-Item dist/interface.exe release_package/
          Compress-Archive -Path release_package -DestinationPath FED-windows-nuitka.zip
          $zipSize = (Get-Item FED-windows-nuitka.zip).Length / 1MB
          Write-Host "ZIP created: $([math]::Round($zipSize, 2)) MB"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: interface.exe
          path: dist/interface.exe
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FED-windows-nuitka-zip
          path: FED-windows-nuitka.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/interface.exe
            FED-windows-nuitka.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
