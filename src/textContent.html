<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0//EN" "http://www.w3.org/TR/REC-html40/strict.dtd">
<html>
    <head>
        <meta name="qrichtext" content="1" />
        <meta charset="utf-8" />

        <style type="text/css">
            p,
            li {
                white-space: pre-wrap;
            }
            hr {
                height: 1px;
                border-width: 0;
            }
            li.unchecked::marker {
                content: "\2610";
            }
            li.checked::marker {
                content: "\2612";
            }

            /* === Estilos modernos compatibles con Qt === */
            .icon_description {
                display: inline-flex; /* Qt soporta inline-flex */
                align-items: center;
                justify-content: center;
                gap: 8px; /* Qt 5.12+ soporta gap */
                padding: 6px 12px;
                background-color: #f8f9fa;
                border: 1px solid #dee2e6;
                border-radius: 6px;
                font-family: "Segoe UI", Arial, sans-serif;
                font-size: 10pt;
                color: #212529;
            }

            .icon_description img {
                vertical-align: middle;
                margin-right: 6px;
            }

            .icon_description span {
                font-weight: 500;
                color: #495057;
            }

            .title {
                display: inline-flex;
                gap: 8px;
                padding: 6px 12px;
                margin-bottom: 12px;
                font-size: 12pt;
            }

            .title span {
                font-weight: 500;
            }

            .title span:nth-child(2) {
                color: #dc143c;
            }
        </style>
    </head>

    <body
        style="
            font-family: &quot;Sans Serif&quot;;
            font-size: 9pt;
            font-weight: 400;
            font-style: normal;
        "
    >
        <div class="title">
            <span>Directorio para</span>&nbsp;<span>IVA</span>
        </div>

        <div class="icon_description">
            <img
                src=":/assets/archivo-xlsx.png"
                width="20"
                height="20"
                alt="Archivo XLSX"
            />
            <span>diot.xlsx</span>
        </div>

        <div class="icon_description">
            <img
                src=":/assets/archivo-xlsx.png"
                width="20"
                height="20"
                alt="Archivo XLSX"
            />
            <span>egresos.xlsx</span>
        </div>

        <div class="icon_description">
            <img
                src=":/assets/archivo-xlsx.png"
                width="20"
                height="20"
                alt="Archivo XLSX"
            />
            <span>HSBC8881.pdf</span>
        </div>

        <div class="icon_description">
            <img
                src=":/assets/archivo-xlsx.png"
                width="20"
                height="20"
                alt="Archivo XLSX"
            />
            <span>BASE2014.PDF</span>
        </div>
    </body>
</html>
